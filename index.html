<section class="sec" id="contact">
  <div class="contact-form-wrap">
    <div class="form-eye-brow">Contact Us</div>
    <form id="js-contact-form" name="contact" method="POST" netlify> 
      <input type="hidden" name="form-name" value="Contact Form" />
      <input type="text" name="honeypot" class="hp" style="display:none;" />
      <div class="form-row">
        <label for="service">What do you need?</label>
        <select id="service" name="service">
          <option value="">Select a service</option>
          <option value="service1">Service 1</option>
          <option value="service2">Service 2</option>
        </select>
      </div>
      <div class="form-row">
        <label for="message">Message:</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <div class="form-row">
        <button type="submit" id="js-submit-btn" class="btn-submit">Submit <svg><!-- SVG Arrow Here --></svg></button>
      </div>
      <div id="js-form-success" class="form-status" style="display:none;">Your message has been sent successfully!</div>
      <div id="js-form-error" class="form-status" style="display:none;">There was an error sending your message.</div>
    </form>
  </div>
</section>

<style>
/* New contact form styles */
.contact-form-wrap { /* styles */ }
.form-eye-brow { /* styles */ }
.form-border { /* styles */ }
.form-row { /* styles */ }
.form-field { /* styles */ }
.btn-submit { /* styles */ }
.form-status { /* styles */ }
.hp { /* styles */ }

@media (max-width: 720px) {
  .form-row {
    display: block;
    width: 100%;
  }
}
</style>

<script>
document.getElementById('js-contact-form').addEventListener('submit', function(event) {
  event.preventDefault();
  const form = this;
  const button = document.getElementById('js-submit-btn');
  button.innerHTML = '...'; // Spinner or loading state
  fetch(form.action, {
    method: 'POST',
    body: new FormData(form),
  })
  .then(response => {
    if (response.ok) {
      document.getElementById('js-form-success').style.display = 'block';
    } else {
      throw new Error('Network response was not ok.');
    }
  })
  .catch(error => {
    document.getElementById('js-form-error').style.display = 'block';
  })
  .finally(() => {
    button.innerHTML = 'Submit <svg><!-- SVG Arrow Here --></svg>';
  });
});
</script>
