<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thanks — Message sent</title>
  <meta name="robots" content="noindex"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#0b0b0b;
      color:#f0ede8;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      padding:2rem;
    }
    .card{
      width:min(720px,100%);
      border:1px solid rgba(240,237,232,.12);
      background:#111;
      border-radius:8px;
      padding:2rem;
    }
    h1{font-size:2rem;line-height:1.1;margin-bottom:.75rem}
    p{color:rgba(240,237,232,.7);line-height:1.7;margin-bottom:1.25rem}
    a{
      display:inline-block;
      text-decoration:none;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      padding:.85rem 1.25rem;
      background:#f0ede8;
      color:#0b0b0b;
      border-radius:4px;
    }
    a:hover{opacity:.9}
  </style>
</head>
<body>
  <main class="card">
    <h1>Thanks — your message was sent.</h1>
    <p>I’ll get back to you as soon as possible.</p>
    <a href="/#contact">Back to site</a>
  </main>
</body>
</html>
